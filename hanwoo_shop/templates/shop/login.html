{% extends "shop/base.html" %}
{% block title %}로그인 | {{ S.shop_name }}{% endblock %}
{% block body %}
<div class="wrap narrow">
  <h1 class="page-t">로그인</h1>
  <form method="post" class="box">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="f">이메일<input class="in" type="email" name="email" value="{{ email }}" required autocomplete="email" autofocus></label>
    <label class="f">비밀번호<input class="in" type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn block">로그인</button>
  </form>
  <p class="alt">아직 회원이 아니신가요? <a class="ulink" href="{{ url_for('join', next=request.args.get('next')) }}">회원가입</a></p>
  <p class="alt">회원이 아니어도 주문할 수 있습니다. <a class="ulink" href="{{ url_for('order_lookup') }}">비회원 주문 조회</a></p>
  <p class="alt">비밀번호를 잊으셨다면 고객센터{% if S.phone %}({{ S.phone }}){% endif %}로 연락해 주세요.</p>
</div>
{% endblock %}
