services:
  web:
    build: .
    image: cow-web:latest
    container_name: cow-web
    restart: unless-stopped
    # 외부 노출은 Caddy가 담당. 내부 네트워크에서만 8000 노출
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "8000"
    volumes:
      # SQLite 파일(farm_data.db)을 named volume에 보관 → 재배포/재빌드에도 데이터 유지
      - cow-data:/app/data

  # 몽글몽글 목장 멀티플레이 중계 서버 (WebSocket). 외부 패키지 없이 Node 기본 모듈만 사용
  # 게임 파일은 web(Flask)이 /static/game 으로 제공하고, Caddy가 /static/game/ws 만 여기로 넘긴다
  game-ws:
    image: node:20-alpine
    container_name: cow-game-ws
    restart: unless-stopped
    working_dir: /game
    command: ["node", "server.js"]
    environment:
      PORT: "8931"
    expose:
      - "8931"
    volumes:
      - ./static/game:/game:ro

  # 한우의 기준 쇼핑몰 (hanwoo_shop/) — 농장 관리 앱과 별개 컨테이너·별개 DB
  # Caddy가 koreacow.kr/hanwoo/ 아래 요청만 여기로 넘긴다
  shop:
    build: ./hanwoo_shop
    image: cow-shop:latest
    container_name: cow-shop
    restart: unless-stopped
    expose:
      - "8100"
    environment:
      DATA_DIR: /shop/data
      PORT: "8100"
      URL_PREFIX: /hanwoo
      SECRET_KEY: ${SECRET_KEY:-}
      # 쇼핑몰 백오피스(/hanwoo/admin) 비밀번호는 쇼핑몰 DB에 저장되고, 백오피스 '설정'에서 바꾼다.
      # GitHub Secret SHOP_ADMIN_PASSWORD 를 지정하면 그 값이 우선한다(비밀번호를 잊었을 때 복구용)
      ADMIN_PASSWORD: ${SHOP_ADMIN_PASSWORD:-}
      # 비밀번호가 아직 없을 때 '처음 접속한 사람이 비밀번호를 정하는' 화면을 허용할지 (최초 설정 때만 on)
      ADMIN_SETUP: "on"
      COOKIE_SECURE: "1"
      TRUST_PROXY: "1"
    volumes:
      # 주문 DB(shop_data.db)와 상품 사진(uploads/) → 재배포에도 유지
      - shop-data:/shop/data

  caddy:
    image: caddy:2-alpine
    container_name: cow-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/srv/static:ro   # 정적 파일(css·js·아이콘·게임)은 Caddy가 직접 압축해서 보냄
      - caddy-data:/data     # 발급받은 Let's Encrypt 인증서 보관(재시작에도 유지)
      - caddy-config:/config
    depends_on:
      - web
      - game-ws
      - shop

volumes:
  cow-data:
  shop-data:
  caddy-data:
  caddy-config:
